<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame Maker</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#777; --card:#f2f2f7; --accent:#007aff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2f7; --muted:#8e8e93; --card:#1c1c1e; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; padding-bottom:env(safe-area-inset-bottom); background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
  h1 { font-size:22px; margin:8px 0 4px; }
  p.sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
  button, label.btn { display:block; width:100%; padding:14px; margin:8px 0; border:0; border-radius:12px;
         background:var(--accent); color:#fff; font-size:17px; font-weight:600; text-align:center; }
  button.secondary { background:var(--card); color:var(--accent); }
  button:disabled { opacity:.4; }
  input[type=file] { display:none; }
  #status { font-size:14px; color:var(--muted); margin:12px 0; min-height:20px; }
  #grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
  #grid img { width:100%; border-radius:8px; background:var(--card); }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<h1>Frame Maker</h1>
<p class="sub">사진에 흰색 정사각 프레임을 입힙니다. 모든 처리는 기기 안에서만 이루어집니다.</p>

<label class="btn" for="file">사진 선택</label>
<input id="file" type="file" accept="image/*" multiple>
<button id="save" class="secondary" disabled>사진첩에 저장</button>
<div id="status"></div>
<div id="grid"></div>
<p class="hint">저장 시트가 뜨면 “이미지 저장”(또는 “N개 이미지 저장”)을 누르세요. 공유 기능이 막히면 결과 사진을 길게 눌러 “사진에 추가”를 선택하세요.</p>

<script>
// 사진 긴 변 대비 여백 비율 (사진 7800 : 프레임 8400)
const FRAME_MARGIN_RATIO = 600 / 7800;
// iOS Safari 캔버스 면적 한계(약 16.7M px) 때문에 프레임 한 변을 4096px로 제한
const MAX_FRAME = 4096;

const $ = (id) => document.getElementById(id);
const results = []; // { name, blob, url }

const setStatus = (t) => { $('status').textContent = t; };

async function frameImage(file) {
  // imageOrientation: 'from-image' → EXIF 회전 반영
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const long = Math.max(bmp.width, bmp.height);
  let frame = Math.round(long * (1 + FRAME_MARGIN_RATIO));
  const scale = Math.min(1, MAX_FRAME / frame);
  frame = Math.round(frame * scale);
  const w = Math.round(bmp.width * scale);
  const h = Math.round(bmp.height * scale);

  const canvas = document.createElement('canvas');
  canvas.width = frame; canvas.height = frame;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, frame, frame);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bmp, Math.round((frame - w) / 2), Math.round((frame - h) / 2), w, h);
  bmp.close();

  const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.92));
  canvas.width = canvas.height = 0; // 메모리 해제
  if (!blob) throw new Error('JPG 변환 실패');
  return blob;
}

$('file').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  if (!files.length) return;
  results.forEach((r) => URL.revokeObjectURL(r.url));
  results.length = 0;
  $('grid').innerHTML = '';
  $('save').disabled = true;

  let fail = 0;
  for (let i = 0; i < files.length; i++) {
    setStatus(`처리 중 ${i + 1}/${files.length}…`);
    try {
      const blob = await frameImage(files[i]);
      const base = files[i].name.replace(/\.[^.]+$/, '') || `photo${i + 1}`;
      const name = `${base}_frame.jpg`;
      const url = URL.createObjectURL(blob);
      results.push({ name, blob, url });
      const img = new Image();
      img.src = url;
      $('grid').appendChild(img);
    } catch (err) {
      fail++;
      console.error(files[i].name, err);
    }
  }
  setStatus(`완료: 성공 ${results.length}장${fail ? `, 실패 ${fail}장` : ''}`);
  $('save').disabled = results.length === 0;
  e.target.value = '';
});

$('save').addEventListener('click', async () => {
  const files = results.map((r) => new File([r.blob], r.name, { type: 'image/jpeg' }));
  try {
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files });
      return;
    }
  } catch (err) {
    if (err.name === 'AbortError') return;
    console.error(err);
  }
  // 공유 불가 시: 파일 앱으로 다운로드 (사진첩은 결과 이미지 길게 눌러 저장)
  for (const r of results) {
    const a = document.createElement('a');
    a.href = r.url; a.download = r.name;
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise((res) => setTimeout(res, 300));
  }
  setStatus('공유 기능을 쓸 수 없어 다운로드했습니다. 사진첩 저장은 이미지를 길게 눌러주세요.');
});
</script>
</body>
</html>
